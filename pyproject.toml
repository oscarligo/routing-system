[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "routing-system"
version = "0.1.0"
description = "HFVRPTW con MiniZinc y redes viales de OpenStreetMap"
requires-python = ">=3.12"
dependencies = [
    "minizinc>=0.10,<0.11",
    "osmnx>=2.1,<3",
    "networkx>=3.4,<4",
    "folium>=0.20,<1",
    "scikit-learn>=1.6,<2",
]

[project.scripts]
routing-system = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
